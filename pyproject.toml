[project]
name = "instant4d"
version = "0.1.0"
description = "uv environment for Instant4D"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "einops>=0.8.0",
    "evo>=1.29.0",
    "huggingface-hub>=0.23.4",
    "imageio>=2.36.0",
    "imagesize>=1.4.1",
    "kornia>=0.7.4",
    "matplotlib>=3.9.0",
    "ninja>=1.11.1",
    "numpy>=1.26,<2",
    "omegaconf>=2.3.0",
    "open3d>=0.18.0",
    "opencv-python-headless>=4.9.0.80",
    "packaging>=24.0",
    "pillow>=10.2.0",
    "plyfile>=1.1.0",
    "point-cloud-utils>=0.31.0",
    "pyyaml>=6.0.0",
    "scipy>=1.14.0",
    "setuptools>=70.0.0",
    "tensorboard>=2.17.0",
    "timm>=1.0.7",
    "torch==2.7.0",
    "torch-scatter @ https://data.pyg.org/whl/torch-2.7.0%2Bcu118/torch_scatter-2.1.2%2Bpt27cu118-cp310-cp310-linux_x86_64.whl",
    "torchmetrics>=1.4.0",
    "torchvision==0.22.0",
    "tqdm>=4.67.1",
    "wandb>=0.18.7",
    "websockets>=12.0",
    "yacs>=0.1.8",
]

[dependency-groups]
depth = [
    "appdirs>=1.4.4",
    "attrs>=23.2.0",
    "blosc2>=2.7.0",
    "botocore>=1.34.54",
    "certifi>=2022.12.7",
    "click>=8.1.0",
    "docker-pycreds>=0.4.0",
    "filelock>=3.13.0",
    "fsspec>=2024.2.0",
    "fvcore>=0.1.5.post20221221",
    "gitpython>=3.1.0",
    "h5py>=3.10.0",
    "iopath>=0.1.10",
    "opencv-python>=4.9.0.80",
    "pandas>=2.2.0",
    "protobuf>=4.25.3",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "safetensors>=0.4.0",
    "tabulate>=0.9.0",
    "termcolor>=2.4.0",
    "xformers==0.0.30",
]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
xformers = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
